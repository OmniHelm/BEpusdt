<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 16x16 标签页优化:viewBox 改 32(原 1254 缩 16px 时 X 笔画只 1.5px 看不清),
       X 单层粗 stroke 保证 favicon 尺寸可识别 -->
  <defs>
    <linearGradient id="fg" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4069f6"/>
      <stop offset="1" stop-color="#6f90ff"/>
    </linearGradient>
  </defs>
  <g stroke="url(#fg)" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M5 5 L13 13"/>
    <path d="M27 5 L19 13"/>
    <path d="M5 27 L13 19"/>
    <path d="M27 27 L19 19"/>
  </g>
  <circle cx="16" cy="16" r="4" fill="#FFFFFF"/>
  <circle cx="16" cy="16" r="2.5" fill="#4069f6"/>
</svg>
